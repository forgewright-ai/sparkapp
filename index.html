<!doctype html>
<!-- sparkchat: the one static document. Three views (setup, chat, settings);
     src/main.ts shows one at a time and fills it through the Rust core.
     No inline script, no inline style, ASCII only. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>sparkchat</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <header class="top">
      <span class="mark">sparkchat</span>
      <span id="site" class="site"></span>
      <button id="gear" type="button" class="quiet" hidden>settings</button>
    </header>

    <main id="main">

      <section id="view-setup" class="view" hidden>
        <div class="card setup">
          <h2>connect to a spark box</h2>
          <p class="muted">the forge url and a token from the box --
            <code>spark forge --print-url</code> shows both
            (<code>--user</code> for the user token)</p>
          <form id="setup-form">
            <label for="setup-url">server url</label>
            <input id="setup-url" type="text" autocomplete="off"
              spellcheck="false" placeholder="http://box:8081" required />
            <label for="setup-token">token</label>
            <input id="setup-token" type="password" autocomplete="off"
              spellcheck="false" required />
            <button type="submit" id="setup-connect">connect</button>
          </form>
          <p id="setup-error" class="err" role="alert"></p>
        </div>
      </section>

      <section id="view-chat" class="view chat" hidden>
        <button id="threads-toggle" type="button" class="quiet drawer-btn"
          aria-expanded="false" hidden>threads</button>
        <aside id="threads" class="threads" hidden>
          <div class="head">
            <h2>threads</h2>
            <button id="thread-new" type="button" class="quiet">new</button>
          </div>
          <ul id="thread-list" class="list"></ul>
        </aside>
        <div class="talk">
          <div id="transcript" class="transcript" aria-live="polite"
            aria-label="transcript"></div>
          <form id="chat-form" class="ask">
            <textarea id="chat-text" rows="1" spellcheck="false"
              placeholder="ask (enter sends, shift+enter newline, /help)"
              aria-label="message"></textarea>
            <button type="submit" id="chat-send">send</button>
          </form>
          <div class="statusrow">
            <p id="chat-status" class="muted small mono"></p>
            <button id="chat-stop" type="button" class="quiet" hidden>stop (esc)</button>
          </div>
        </div>
      </section>

      <section id="view-settings" class="view" hidden>
        <div class="card">
          <div class="head">
            <h2>settings</h2>
            <button id="settings-back" type="button" class="quiet">back</button>
          </div>
          <form id="settings-form">
            <label for="settings-url">server url</label>
            <input id="settings-url" type="text" autocomplete="off"
              spellcheck="false" placeholder="http://box:8081" />
            <label for="settings-token">token (blank keeps the current one)</label>
            <input id="settings-token" type="password" autocomplete="off"
              spellcheck="false" />
            <div class="row">
              <button type="submit" id="settings-apply">apply and re-probe</button>
              <button id="settings-forget" type="button" class="danger">forget token</button>
            </div>
          </form>
          <p id="settings-status" class="small mono" role="alert"></p>
        </div>
        <div class="card">
          <h2>brain</h2>
          <dl id="brain-facts" class="facts"></dl>
          <div id="brain-models"></div>
        </div>
        <p id="app-version" class="muted small"></p>
      </section>

    </main>
  </body>
</html>
